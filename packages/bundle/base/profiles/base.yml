name: base
plugins:
  - id: kernel
    name: '@fudo/kernel'
  - id: sessions
    name: '@fudo/session'
  - id: session-jsonl
    name: '@fudo/session-jsonl'
    config:
      root: ~/.fudo/sessions
  - id: tools
    name: '@fudo/tools'
  - id: system-prompt
    name: '@fudo/system-prompt'
  - id: safety
    name: '@fudo/safety'
    config:
      preset: workspace-write
      # Commands run contained by default; sandbox: none runs them as they are.
      sandbox: seatbelt
  - id: tier0
    name: '@fudo/tools-tier0'
  - id: ask
    name: '@fudo/ask'
  - id: tier1
    name: '@fudo/tools-tier1'
  - id: llm
    name: '@fudo/llm-openai'
    config:
      baseUrl: https://ollama.com/v1
      apiKeyEnv: OLLAMA_API_KEY
  - id: agent
    name: '@fudo/agent'
  - id: agent-loop
    name: '@fudo/agent-loop'
