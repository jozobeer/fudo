<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>jozo-harness</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header id="status" aria-live="polite"></header>
    <div id="shell">
      <aside id="sidebar">
        <div class="brand">jozo-harness</div>
        <button id="new-session" class="primary" type="button">New session</button>
        <nav id="session-list" aria-label="Sessions"></nav>
        <div id="rail-foot"></div>
      </aside>
      <main id="conversation" tabindex="0"></main>
    </div>
    <footer>
      <form id="composer">
        <textarea
          id="input"
          rows="1"
          placeholder="Message jozo-harness…  (Enter sends, Shift+Enter adds a line)"
        ></textarea>
        <div class="actions">
          <button id="send" class="primary" type="submit">Send</button>
          <button id="cancel" type="button">Stop</button>
        </div>
      </form>
    </footer>
    <div id="panel"></div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
